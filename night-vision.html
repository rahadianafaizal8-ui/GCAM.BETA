<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kamera Night Vision</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#050805;--panel:#0c130c;--fg:#b6ffb6;--dim:#5d8f5d;--acc:#39ff14;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font-family:ui-monospace,Menlo,Consolas,monospace;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:12px}
h1{font-size:15px;letter-spacing:.2em;margin:4px 0 10px;color:var(--acc)}
.view{position:relative;background:#000;border:1px solid #1d3a1d;border-radius:10px;overflow:hidden;aspect-ratio:4/3}
canvas{width:100%;height:100%;display:block;object-fit:cover}
.mask{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.85) 100%)}
.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
.hud{position:absolute;left:10px;right:10px;top:8px;display:flex;justify-content:space-between;font-size:12px;color:var(--acc);text-shadow:0 0 4px #000;pointer-events:none}
.hud .rec::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#f33;margin-right:6px;animation:b 1s infinite}
@keyframes b{50%{opacity:.15}}
.cross{position:absolute;left:50%;top:50%;width:36px;height:36px;margin:-18px 0 0 -18px;border:1px solid rgba(57,255,20,.5);border-radius:50%;pointer-events:none}
.msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;font-size:13px;line-height:1.5;background:#000d}
.panel{background:var(--panel);border:1px solid #1d3a1d;border-radius:10px;margin-top:10px;padding:12px;display:grid;gap:10px}
label{display:grid;grid-template-columns:90px 1fr 40px;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
label b{color:var(--fg);font-weight:400;text-align:right}
input[type=range]{width:100%;accent-color:var(--acc)}
.row{display:flex;flex-wrap:wrap;gap:8px}
button{flex:1;min-width:90px;background:#102010;color:var(--fg);border:1px solid #2b5a2b;border-radius:8px;padding:10px;font:inherit;font-size:12px;cursor:pointer}
button.on{background:var(--acc);color:#031003;border-color:var(--acc)}
</style>
</head>
<body>
<div class="wrap">
<h1>◉ NIGHT VISION</h1>
<div class="view" id="view">
<canvas id="c"></canvas>
<div class="scan"></div><div class="mask" id="mask"></div><div class="cross"></div>
<div class="hud"><span class="rec">REC</span><span id="clock">--:--:--</span></div>
<div class="msg" id="msg"><div>Mengaktifkan kamera…<br>Izinkan akses kamera saat diminta.</div></div>
<video id="v" playsinline muted autoplay style="display:none"></video>
</div>
<div class="panel">
<label>Penguat<input type="range" id="gain" min="0.5" max="8" step="0.1" value="3"><b id="gainV">3.0</b></label>
<label>Kontras<input type="range" id="con" min="0.5" max="2.5" step="0.05" value="1.3"><b id="conV">1.3</b></label>
<label>Noise<input type="range" id="noi" min="0" max="0.4" step="0.01" value="0.12"><b id="noiV">0.12</b></label>
<div class="row">
<button id="auto" class="on">Auto-gain: ON</button>
<button id="mode">Warna: Hijau</button>
<button id="goggle" class="on">Mask: ON</button>
<button id="flip">Ganti Kamera</button>
</div>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
const v=$('v'),cv=$('c'),ctx=cv.getContext('2d',{willReadFrequently:true});
const W=480,H=360;cv.width=W;cv.height=H;
let facing='environment',stream=null,auto=true,modeIdx=0,autoGain=3,prev=null;
const modes=[['Hijau',[.12,1,.18]],['Putih',[1,1,1]],['Kuning',[1,.8,.2]]];
const gain=$('gain'),con=$('con'),noi=$('noi');
[['gain','gainV'],['con','conV'],['noi','noiV']].forEach(([a,b])=>{
  const el=$(a);el.oninput=()=>{$(b).textContent=(+el.value).toFixed(a==='noi'?2:1)};
});
$('auto').onclick=e=>{auto=!auto;e.target.classList.toggle('on',auto);e.target.textContent='Auto-gain: '+(auto?'ON':'OFF')};
$('mode').onclick=e=>{modeIdx=(modeIdx+1)%modes.length;e.target.textContent='Warna: '+modes[modeIdx][0]};
$('goggle').onclick=e=>{const on=e.target.classList.toggle('on');$('mask').style.display=on?'block':'none';e.target.textContent='Mask: '+(on?'ON':'OFF')};
$('flip').onclick=()=>{facing=facing==='environment'?'user':'environment';start()};

async function start(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  $('msg').style.display='flex';
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    $('msg').innerHTML='<div>Browser tidak mendukung akses kamera, atau halaman bukan HTTPS.</div>';return;
  }
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:960},height:{ideal:720}},audio:false});
    v.srcObject=stream;await v.play();
    prev=null;$('msg').style.display='none';
  }catch(err){
    $('msg').innerHTML='<div>Kamera tidak dapat diakses ('+(err.name||'error')+').<br>Izinkan akses kamera di browser. Jika tampilan ini tertanam, buka tautan halaman di tab baru.</div>';
  }
}

function frame(){
  requestAnimationFrame(frame);
  if(!stream||v.readyState<2)return;
  ctx.save();
  if(facing==='user'){ctx.translate(W,0);ctx.scale(-1,1)}
  ctx.drawImage(v,0,0,W,H);ctx.restore();
  const img=ctx.getImageData(0,0,W,H),d=img.data,n=W*H;
  if(!prev||prev.length!==n)prev=new Float32Array(n);
  const col=modes[modeIdx][1],c=+con.value,nz=+noi.value;
  let g=+gain.value;
  if(auto){g=autoGain;gain.value=Math.min(8,Math.max(.5,g));$('gainV').textContent=(+gain.value).toFixed(1)}
  let sum=0;
  for(let i=0,p=0;p<n;i+=4,p++){
    let l=(d[i]*.299+d[i+1]*.587+d[i+2]*.114)/255;
    sum+=l;
    l=prev[p]=prev[p]*.4+l*.6; // peredam noise temporal
    l=Math.pow(Math.min(1,l*g),.7); // gamma untuk mengangkat bayangan
    l=(l-.5)*c+.5;
    l+=(Math.random()-.5)*nz*(1.2-l); // grain lebih terlihat di area gelap
    l=l<0?0:l>1?1:l;
    const s=l*255;
    d[i]=s*col[0];d[i+1]=s*col[1];d[i+2]=s*col[2];d[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  if(auto){ // auto-gain menuju kecerahan rata-rata target
    const avg=sum/n,target=.28;
    autoGain=Math.min(8,Math.max(.5,autoGain*(1+(target-avg)*.08/(avg+.02)*2)));
  }
}
setInterval(()=>{$('clock').textContent=new Date().toLocaleTimeString('id-ID',{hour12:false})},500);
start();frame();
</script>
</body>
</html>
